# Homebrew tools must also be visible to tmux run-shell commands.
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",*:hyperlinks"
set -g set-clipboard on
set -g allow-passthrough on
set -g extended-keys on
set -g focus-events on
set -g mouse on
set -g history-limit 100000
set -sg escape-time 10

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status on

# Use the readable project name for the WezTerm tab and tmux status.
set -g set-titles on
set -g set-titles-string "#{?@project_name,#{@project_name},#S}"
setw -g automatic-rename on
set -g allow-rename off

# Direct pane controls retained from the previous setup.
bind -n M-C split-window -h -c "#{pane_current_path}"
bind -n M-X split-window -v -c "#{pane_current_path}"
bind -n M-W kill-pane
bind -n M-S-Left select-pane -L
bind -n M-S-Right select-pane -R
bind -n M-S-Up select-pane -U
bind -n M-S-Down select-pane -D

bind -T copy-mode-vi WheelUpPane send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 1 scroll-down

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Prefix commands used directly and by WezTerm's Cmd shortcuts.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind c new-window -c "#{pane_current_path}"

unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g status-style bg='#282828',fg='#ebdbb2'
set -g status-left-length 40
set -g status-left '#[fg=#a89984,bg=#3c3836,bold] #{?@project_name,#{@project_name},#S} #[bg=default,fg=default] '
set -g status-right '#{?client_prefix,#[reverse] PREFIX #[noreverse],} %H:%M '
setw -g window-status-current-style bg='#ebdbb2',fg='#282828',bold
setw -g window-status-current-format ' #I:#W '
setw -g window-status-style bg='#3c3836',fg='#a89984'
setw -g window-status-format ' #I:#W '
set -g pane-border-style fg='#3c3836'
set -g pane-active-border-style fg='#fe8019'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-sessionx'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Prefix+s opens a large existing-session picker with a live pane preview.
unbind -q O
set -g @sessionx-bind 's'
set -g @sessionx-bind-kill-session 'ctrl-k'
set -g @sessionx-filter-current 'false'
set -g @sessionx-fzf-builtin-tmux 'on'
set -g @sessionx-legacy-fzf-support 'on'
set -g @sessionx-window-height '90%'
set -g @sessionx-window-width '90%'
set -g @sessionx-layout 'reverse'
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '55%'
set -g @sessionx-git-branch 'on'
set -g @sessionx-ls-command 'eza --tree --color=always --icons=always --level=2'

# TPM must remain last.
run '~/.tmux/plugins/tpm/tpm'
